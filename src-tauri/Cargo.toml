[package]
name = "rugitg"
version = "0.3.1"
description = "Fast gitg-like Git client"
edition = "2021"

[lib]
name = "rugitg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
parking_lot = "0.12"
dirs = "6"
base64 = "0.22"
notify = "8"
getrandom = "0.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
