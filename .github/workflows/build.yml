name: build

# Push a tag v<version> to publish a release: installers for Linux and
# Windows, update signatures and latest.json for the in-app updater.
# Manual runs only build and keep the packages as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi

      - name: Read release notes from the tag message
        run: |
          git fetch --force origin "+refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents:body)' "$TAG" > notes.md
          cat notes.md

      # The release stays a draft until every asset and latest.json are uploaded.
      - id: create
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const tag = process.env.TAG;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `rugitg ${tag}`,
              body: fs.readFileSync('notes.md', 'utf8').trim(),
              draft: true,
              prerelease: false,
            });
            return String(data.id);

  build:
    needs: create-release
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb rpm appimage
          - os: windows-latest
            bundles: nsis msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm install -g @tauri-apps/cli@2

      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            # Signed update artifacts (.sig) for the in-app updater.
            tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json
          else
            tauri build --bundles ${{ matrix.bundles }}
          fi

      - name: Collect packages
        shell: bash
        run: |
          shopt -s globstar nullglob
          mkdir -p dist-release
          for f in src-tauri/target/release/bundle/**/*.{deb,rpm,AppImage,exe,msi}{,.sig}; do
            cp "$f" dist-release/
          done
          ls -l dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: rugitg-${{ runner.os }}
          path: dist-release/*

      - name: Upload to the draft release
        if: needs.create-release.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist-release/* --clobber --repo "${{ github.repository }}"

  publish:
    needs: [create-release, build]
    if: needs.create-release.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # latest.json is written once from the uploaded signatures, so the two
      # build jobs never overwrite each other's entries.
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const tag = process.env.TAG;
            const { data: release } = await github.rest.repos.getRelease({ owner, repo, release_id });
            const assets = release.assets;

            const download = async (asset) => {
              const res = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
                owner, repo, asset_id: asset.id, headers: { accept: 'application/octet-stream' },
              });
              return Buffer.from(res.data).toString('utf8').trim();
            };
            const entry = async (test) => {
              const pkg = assets.find((a) => test.test(a.name) && !a.name.endsWith('.sig'));
              if (!pkg) return null;
              const sig = assets.find((a) => a.name === `${pkg.name}.sig`);
              if (!sig) return null;
              return {
                signature: await download(sig),
                // Final URL of the published release (drafts use temporary URLs).
                url: `https://github.com/${owner}/${repo}/releases/download/${encodeURIComponent(tag)}/${encodeURIComponent(pkg.name)}`,
              };
            };

            const platforms = {};
            const add = async (keys, test) => {
              const e = await entry(test);
              if (e) for (const k of keys) platforms[k] = e;
            };
            await add(['linux-x86_64', 'linux-x86_64-appimage'], /\.AppImage$/);
            await add(['linux-x86_64-deb'], /\.deb$/);
            await add(['linux-x86_64-rpm'], /\.rpm$/);
            await add(['windows-x86_64', 'windows-x86_64-nsis'], /-setup\.exe$/);
            await add(['windows-x86_64-msi'], /\.msi$/);

            for (const required of ['linux-x86_64', 'windows-x86_64']) {
              if (!platforms[required]) core.setFailed(`No signed package for ${required}: is TAURI_SIGNING_PRIVATE_KEY set?`);
            }
            if (!platforms['linux-x86_64'] || !platforms['windows-x86_64']) return;

            const latest = {
              version: tag.replace(/^v/, ''),
              notes: release.body || '',
              pub_date: new Date().toISOString(),
              platforms,
            };
            const old = assets.find((a) => a.name === 'latest.json');
            if (old) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id, name: 'latest.json',
              data: JSON.stringify(latest, null, 2),
              headers: { 'content-type': 'application/json' },
            });
            await github.rest.repos.updateRelease({ owner, repo, release_id, draft: false, make_latest: 'true' });
            core.info(`Published ${tag} with platforms: ${Object.keys(platforms).join(', ')}`);
